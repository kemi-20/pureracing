CsBBzYzMhYVFAbbWoFlTA4JRBERRQkNPU9qmGpMDggEEAcqMYGMGhQFBgwHHQsHD2AnDAEMCAQKEw0SHAoNBwkQAQUCEUQMDEAECRgWHiAxgFpOeg8eCwcHMAwMMAYGCx8OY0FMampMXDcLDwcCBR9dNVqAgg92DgQNBgYUBxGHER4DBgwIExMOHwsGED4RGC4PHxcaHw==") format("truetype");
    font-weight: normal;
    font-style: normal;
  }

  :host {
    --chewie-background: rgba(41, 41, 41, .7);
    --chewie-icon: rgb(200, 200, 200);
    --media-primary-color: #fff;
    --media-secondary-color: transparent;
    --media-control-background: transparent;
    --media-control-hover-background: transparent;
    --media-control-transition-in: opacity 300ms linear;
    --media-control-transition-out: opacity 300ms linear;
    color: var(--chewie-icon);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  media-controller {
    width: 100%;
    height: 100%;
    overflow: hidden;
    color: var(--chewie-icon);
    background: #000;
  }

  .top-bar {
    box-sizing: border-box;
    height: 30px;
    margin: 5px 5px 0;
    display: flex;
    align-items: stretch;
    pointer-events: none;
  }

  .expand-button {
    box-sizing: border-box;
    height: 30px;
    min-width: 48px;
    padding: 0 16px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    color: var(--chewie-icon);
    background: var(--chewie-background);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    --media-button-padding: 0;
    --media-control-height: 30px;
  }

  .cupertino-glyph {
    width: 16px;
    height: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: "RacingDaily Cupertino Icons";
    font-size: 16px;
    line-height: 1;
    font-style: normal;
    font-weight: normal;
    -webkit-font-smoothing: antialiased;
  }

  .expand-exit { display: none; }
  media-fullscreen-button[mediaisfullscreen] .expand-enter { display: none; }
  media-fullscreen-button[mediaisfullscreen] .expand-exit { display: inline-flex; }

  .center-play {
    width: 56px;
    height: 56px;
    padding: 12px;
    border-radius: 50%;
    color: var(--chewie-icon);
    background: var(--chewie-background);
    --media-button-padding: 0;
    --media-control-height: 32px;
    --media-button-icon-width: 32px;
    --media-button-icon-height: 32px;
    transition: opacity 300ms linear;
  }

  media-controller:not([mediapaused]) .center-play {
    opacity: 0;
    pointer-events: none;
  }

  .bottom-bar {
    box-sizing: border-box;
    height: 30px;
    min-width: 0;
    margin: 0 5px 5px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    overflow: hidden;
    color: var(--chewie-icon);
    background: var(--chewie-background);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    pointer-events: auto;
  }

  .bottom-bar media-seek-backward-button,
  .bottom-bar media-seek-forward-button,
  .bottom-bar media-play-button {
    box-sizing: border-box;
    flex: 0 0 auto;
    height: 30px;
    min-width: 0;
    padding: 0;
    color: var(--chewie-icon);
    --media-button-padding: 0;
    --media-control-height: 30px;
  }

  .bottom-bar media-seek-backward-button {
    margin-left: 10px;
    padding: 0 6px;
  }

  .bottom-bar media-play-button { padding: 0 6px; }

  .bottom-bar media-seek-forward-button {
    margin-right: 8px;
    padding: 0 8px 0 6px;
  }

  .bottom-bar .seek-glyph { font-size: 18px; width: 18px; height: 18px; }

  .play-pause-icon {
    position: relative;
    width: 18px;
    height: 18px;
    display: block;
  }

  .play-pause-icon svg {
    position: absolute;
    inset: 0;
    width: 18px;
    height: 18px;
    fill: currentColor;
    transition: opacity 400ms linear, transform 400ms ease;
  }

  media-play-button .pause-shape { opacity: 0; transform: rotate(-90deg) scale(.7); }
  media-play-button[mediapaused] .play-shape { opacity: 1; transform: rotate(0) scale(1); }
  media-play-button:not([mediapaused]) .play-shape { opacity: 0; transform: rotate(90deg) scale(.7); }
  media-play-button:not([mediapaused]) .pause-shape { opacity: 1; transform: rotate(0) scale(1); }
  .center-play .replay-shape { display: none; }
  .center-play[mediaended] .play-shape,
  .center-play[mediaended] .pause-shape { display: none; }
  .center-play[mediaended] .replay-shape { display: block; opacity: 1; transform: none; }

  .bottom-bar media-time-display {
    flex: 0 0 auto;
    padding: 0 12px 0 0;
    color: var(--chewie-icon);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    --media-control-padding: 0;
    --media-control-height: 30px;
  }

  .bottom-bar media-time-range {
    flex: 1 1 auto;
    min-width: 16px;
    height: 30px;
    padding: 0 12px 0 0;
    --media-range-track-height: 5px;
    --media-range-track-border-radius: 0;
    --media-range-track-background: rgba(255, 255, 255, .08);
    --media-time-range-buffered-color: rgba(255, 255, 255, .24);
    --media-range-bar-color: rgba(255, 255, 255, .47);
    --media-range-thumb-background: #fff;
    --media-range-thumb-width: 6px;
    --media-range-thumb-height: 6px;
    --media-range-thumb-border-radius: 50%;
    --media-range-thumb-box-shadow: 0 1px 4px rgba(0, 0, 0, .45);
  }

  media-loading-indicator {
    color: #fff;
    --media-loading-indicator-icon-width: 32px;
    --media-loading-indicator-icon-height: 32px;
  }

  media-controller:not([medialoading]) media-loading-indicator { display: none; }

  @media (orientation: landscape) {
    .top-bar { height: 47px; }
    .expand-button { height: 47px; min-width: 64px; padding: 0 24px; }
    .bottom-bar { height: 47px; }
    .bottom-bar media-seek-backward-button,
    .bottom-bar media-seek-forward-button,
    .bottom-bar media-play-button,
    .bottom-bar media-time-display,
    .bottom-bar media-time-range { height: 47px; --media-control-height: 47px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 1ms !important; }
  }
</style>

<media-controller
  autohide="3"
  autohideovercontrols
  defaultstreamtype="on-demand"
  keyboardbackwardseekoffset="15"
  keyboardforwardseekoffset="15"
>
  <slot name="media" slot="media"></slot>
  <slot name="poster" slot="poster"></slot>
  <media-error-dialog slot="dialog"></media-error-dialog>

  <div class="top-bar" slot="top-chrome">
    <media-fullscreen-button class="expand-button" notooltip aria-label="全屏">
      <span slot="icon">
        <i class="cupertino-glyph expand-enter" aria-hidden="true">&#xF386;</i>
        <i class="cupertino-glyph expand-exit" aria-hidden="true">&#xF37D;</i>
      </span>
    </media-fullscreen-button>
  </div>

  <media-play-button class="center-play" slot="centered-chrome" notooltip aria-label="播放">
    <span class="play-pause-icon" slot="icon">
      <svg class="play-shape" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <svg class="pause-shape" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
      <svg class="replay-shape" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
    </span>
  </media-play-button>

  <media-loading-indicator slot="centered-chrome" noautohide></media-loading-indicator>

  <div class="bottom-bar">
    <media-seek-backward-button seekoffset="15" notooltip aria-label="后退 15 秒">
      <i class="cupertino-glyph seek-glyph" slot="icon" aria-hidden="true">&#xF690;</i>
    </media-seek-backward-button>

    <media-play-button notooltip aria-label="播放或暂停">
      <span class="play-pause-icon" slot="icon">
        <svg class="play-shape" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="pause-shape" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
      </span>
    </media-play-button>

    <media-seek-forward-button seekoffset="15" notooltip aria-label="前进 15 秒">
      <i class="cupertino-glyph seek-glyph" slot="icon" aria-hidden="true">&#xF699;</i>
    </media-seek-forward-button>

    <media-time-display notoggle aria-label="已播放时间"></media-time-display>
    <media-time-range aria-label="播放进度"></media-time-range>
    <media-time-display remaining notoggle aria-label="剩余时间"></media-time-display>
  </div>
</media-controller>
