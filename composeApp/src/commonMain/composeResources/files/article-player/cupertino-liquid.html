<!--
  Control layout adapted from Chewie's CupertinoControls.
  Control glyph paths are vendored from WebKit's iOS modern media controls.
-->
<style>
  :host {
    --glass-fill: rgba(18, 18, 20, 0.56);
    --glass-fill-pressed: rgba(38, 38, 42, 0.68);
    --glass-edge: rgba(255, 255, 255, 0.22);
    --glass-highlight: rgba(255, 255, 255, 0.14);
    --glass-shadow: rgba(0, 0, 0, 0.28);
    --control-size: 36px;
    --media-primary-color: #fff;
    --media-secondary-color: transparent;
    --media-control-background: transparent;
    --media-control-hover-background: transparent;
    --media-control-transition-in: opacity 350ms cubic-bezier(0.25, 0.1, 0.25, 1);
    --media-control-transition-out: opacity 250ms cubic-bezier(0.25, 0.1, 0.25, 1);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  media-controller {
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    overflow: hidden;
    --media-control-transition-in: opacity 350ms cubic-bezier(0.25, 0.1, 0.25, 1);
    --media-control-transition-out: opacity 250ms cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  .top-controls,
  .bottom-controls,
  .glass-control,
  .center-play {
    -webkit-backdrop-filter: saturate(180%) blur(17.5px);
    backdrop-filter: saturate(180%) blur(17.5px);
    background:
      linear-gradient(var(--glass-highlight), var(--glass-highlight)),
      var(--glass-fill);
    border: 1px solid var(--glass-edge);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.13),
      0 5px 18px var(--glass-shadow);
  }

  .top-controls {
    box-sizing: border-box;
    width: 100%;
    padding: 5px;
    display: flex;
    justify-content: space-between;
    background: transparent;
    border: 0;
    box-shadow: none;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    pointer-events: none;
  }

  .glass-control {
    width: 48px;
    height: 32px;
    padding: 0;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    --media-button-padding: 0;
    --media-control-height: 20px;
    --media-button-icon-width: 20px;
    --media-button-icon-height: 20px;
    transition:
      transform 100ms ease-out,
      background-color 140ms ease-out,
      box-shadow 140ms ease-out;
  }

  .glass-control:active,
  .bottom-controls media-play-button:active,
  .bottom-controls media-seek-backward-button:active,
  .bottom-controls media-seek-forward-button:active,
  .center-play:active {
    transform: scale(0.89);
    background-color: var(--glass-fill-pressed);
  }

  .center-play {
    width: 60px;
    height: 60px;
    padding: 0;
    border-radius: 50%;
    --media-button-padding: 0;
    --media-control-height: 26px;
    --media-button-icon-width: 22px;
    --media-button-icon-height: 26px;
    transition:
      opacity 250ms ease,
      transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1),
      background-color 140ms ease-out;
  }

  media-controller:not([mediapaused]) .center-play {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.86);
  }

  .bottom-controls {
    box-sizing: border-box;
    height: 48px;
    min-width: 0;
    margin: 5px;
    padding: 0 8px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 1px;
    line-height: normal;
    pointer-events: auto;
  }

  .bottom-controls media-play-button,
  .bottom-controls media-seek-backward-button,
  .bottom-controls media-seek-forward-button {
    flex: 0 0 var(--control-size);
    width: var(--control-size);
    height: var(--control-size);
    padding: 0;
    border-radius: 50%;
    --media-button-padding: 0;
    --media-control-height: 19px;
    --media-button-icon-width: 19px;
    --media-button-icon-height: 19px;
    transition: transform 100ms ease-out, background-color 140ms ease-out;
  }

  .bottom-controls media-play-button {
    --media-button-icon-width: 17px;
    --media-button-icon-height: 20px;
  }

  .bottom-controls media-time-display {
    flex: 0 0 auto;
    min-width: 41px;
    padding: 0 5px;
    color: #fff;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    text-align: center;
    --media-control-background: transparent;
    --media-control-padding: 0;
    --media-control-height: 20px;
  }

  .bottom-controls media-time-range {
    flex: 1 1 80px;
    min-width: 54px;
    height: 32px;
    padding: 0 7px;
    --media-range-track-height: 5px;
    --media-range-track-border-radius: 3px;
    --media-range-track-background: rgba(255, 255, 255, 0.20);
    --media-time-range-buffered-color: rgba(255, 255, 255, 0.32);
    --media-range-bar-color: rgba(255, 255, 255, 0.78);
    --media-range-thumb-background: #fff;
    --media-range-thumb-width: 9px;
    --media-range-thumb-height: 9px;
    --media-range-thumb-border-radius: 50%;
    --media-range-thumb-box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
  }

  .icon-stack {
    position: relative;
    width: 22px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .icon-stack svg {
    position: absolute;
    display: block;
    fill: currentColor;
  }

  media-mute-button .volume-off,
  media-fullscreen-button .fullscreen-exit {
    opacity: 0;
  }

  media-mute-button[mediavolumelevel="off"] .volume-on,
  media-fullscreen-button[mediaisfullscreen] .fullscreen-enter {
    opacity: 0;
  }

  media-mute-button[mediavolumelevel="off"] .volume-off,
  media-fullscreen-button[mediaisfullscreen] .fullscreen-exit {
    opacity: 1;
  }

  media-loading-indicator {
    --media-loading-indicator-icon-width: 28px;
    --media-loading-indicator-icon-height: 28px;
    color: #fff;
    filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.35));
  }

  media-controller:not([medialoading]) media-loading-indicator {
    display: none;
  }

  @media (max-width: 390px) {
    :host { --control-size: 31px; }
    .bottom-controls { padding: 0 5px; }
    .bottom-controls media-time-display { min-width: 37px; padding: 0 3px; font-size: 10px; }
    .bottom-controls media-time-range { padding: 0 4px; min-width: 40px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }
  }

  @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
    :host { --glass-fill: rgba(15, 15, 17, 0.91); --glass-edge: rgba(255, 255, 255, 0.42); }
    .top-controls, .bottom-controls, .glass-control, .center-play {
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }
  }
</style>
