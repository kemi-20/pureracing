  Safari-style controls adapted from WebKit's modern-media-controls.
  See WEBKIT-LICENSE.txt in this directory for the upstream Apple BSD license.
  Playback state is supplied by Media Chrome so the UI also works in Android WebView and WebView2.
-->
<style>
  :host {
    --primary-glyph-color: #fff;
    --secondary-glyph-color: rgba(255, 255, 255, .75);
    --media-primary-color: #fff;
    --media-secondary-color: transparent;
    --media-control-background: transparent;
    --media-control-hover-background: transparent;
    --media-focus-box-shadow: none;
    --media-control-transition-in: opacity 100ms linear;
    --media-control-transition-out: opacity 250ms linear;
    color: var(--secondary-glyph-color);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  media-controller {
    width: 100%;
    height: 100%;
    overflow: hidden;
    color: var(--secondary-glyph-color);
    background: #000;
  }

  .safari-scrim {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: rgba(0, 0, 0, .55);
    transition: opacity 250ms linear;
  }

  .safari-chrome {
    z-index: 1;
    transition: opacity 100ms linear;
  }

  media-controller[userinactive] .safari-scrim,
  media-controller[userinactive] .safari-chrome {
    opacity: 0;
    pointer-events: none;
    transition-duration: 250ms;
  }

  .safari-glass {
    background:
      linear-gradient(rgba(255, 255, 255, .14), rgba(255, 255, 255, .14)),
      rgba(0, 0, 0, .55);
    -webkit-backdrop-filter: saturate(180%) blur(17.5px);
    backdrop-filter: saturate(180%) blur(17.5px);
  }

  .top-bar {
    position: absolute;
    left: 6px;
    top: 6px;
    height: 31px;
    display: flex;
    align-items: center;
  }

  .expand-button {
    box-sizing: border-box;
    width: 44px;
    height: 31px;
    padding: 0;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--secondary-glyph-color);
    line-height: 0;
    --media-button-padding: 0;
    --media-control-height: 31px;
  }

  .expand-button > [slot="icon"] {
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 0;
  }

  .webkit-icon {
    width: 16px;
    height: 16px;
    display: block;
    flex: none;
    fill: currentColor;
  }

  .expand-exit { display: none; }
  media-fullscreen-button[mediaisfullscreen] .expand-enter { display: none; }
  media-fullscreen-button[mediaisfullscreen] .expand-exit { display: inline-flex; }

  .center-controls {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    gap: 32px;
    pointer-events: auto;
  }

  .center-controls > media-seek-backward-button,
  .center-controls > media-seek-forward-button,
  .center-controls > media-play-button {
    box-sizing: border-box;
    width: 52px;
    height: 52px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--primary-glyph-color);
    --media-button-padding: 0;
    --media-control-height: 52px;
    --media-focus-box-shadow: none;
    outline: none;
    box-shadow: none;
    -webkit-tap-highlight-color: transparent;
  }

  .center-controls > media-play-button:focus,
  .center-controls > media-play-button:focus-visible,
  .center-controls > media-play-button:active {
    outline: none;
    box-shadow: none;
  }

  .center-controls > media-play-button { width: 60px; height: 60px; }
  .center-controls .seek-glyph { width: 26px; height: 30px; }

  .center-controls > * > [slot="icon"],
  .expand-button > [slot="icon"] {
    transition: transform 150ms;
    will-change: transform;
  }

  .center-controls > *:active > [slot="icon"],
  .expand-button:active > [slot="icon"] { transform: scale(.89); }

  media-controller:not([mediahasplayed]) .top-bar,
  media-controller:not([mediahasplayed]) .bottom-bar,
  media-controller:not([mediahasplayed]) .center-controls > media-seek-backward-button,
  media-controller:not([mediahasplayed]) .center-controls > media-seek-forward-button {
    opacity: 0;
    pointer-events: none;
  }

  media-controller:not([mediahasplayed]) .safari-scrim { opacity: 0; }
  media-controller:not([mediahasplayed]) .center-controls { gap: 0; }
  media-controller:not([mediahasplayed]) .center-controls > media-play-button {
    border-radius: 50%;
    background:
      linear-gradient(rgba(255, 255, 255, .14), rgba(255, 255, 255, .14)),
      rgba(0, 0, 0, .55);
    -webkit-backdrop-filter: saturate(180%) blur(17.5px);
    backdrop-filter: saturate(180%) blur(17.5px);
  }

  .bottom-bar {
    box-sizing: border-box;
    position: absolute;
    left: 6px;
    right: 6px;
    bottom: 6px;
    height: 31px;
    min-width: 0;
    padding: 0 9px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
    overflow: hidden;
    pointer-events: auto;
  }

  .play-pause-icon {
    position: relative;
    width: 18px;
    height: 18px;
    display: block;
  }

  .play-pause-icon svg {
    position: absolute;
    inset: 0;
    width: 18px;
    height: 18px;
    fill: currentColor;
    transition: opacity 400ms linear, transform 400ms ease;
  }

  .center-controls > media-play-button .play-pause-icon,
  .center-controls > media-play-button .play-pause-icon svg {
    width: 33px;
    height: 39px;
  }

  media-play-button .pause-shape { opacity: 0; transform: rotate(-90deg) scale(.7); }
  media-play-button[mediapaused] .play-shape { opacity: 1; transform: rotate(0) scale(1); }
  media-play-button:not([mediapaused]) .play-shape { opacity: 0; transform: rotate(90deg) scale(.7); }
  media-play-button:not([mediapaused]) .pause-shape { opacity: 1; transform: rotate(0) scale(1); }
  .center-controls media-play-button .replay-shape { display: none; }
  .center-controls media-play-button[mediaended] .play-shape,
  .center-controls media-play-button[mediaended] .pause-shape { display: none; }
  .center-controls media-play-button[mediaended] .replay-shape { display: block; opacity: 1; transform: none; }

  .bottom-bar media-time-display {
    flex: 0 0 auto;
    min-width: 38px;
    padding: 0;
    color: var(--secondary-glyph-color);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "case";
    --media-control-padding: 0;
    --media-control-height: 31px;
  }

  .bottom-bar media-time-range {
    flex: 1 1 auto;
    min-width: 16px;
    height: 31px;
    padding: 0;
    --media-range-track-height: 5px;
    --media-range-track-border-radius: 4.5px;
    --media-range-track-background: rgba(255, 255, 255, .10);
    --media-time-range-buffered-color: rgba(255, 255, 255, .08);
    --media-range-bar-color: rgba(255, 255, 255, .45);
    --media-range-thumb-background: #fff;
    --media-range-thumb-width: 9px;
    --media-range-thumb-height: 9px;
    --media-range-thumb-border-radius: 50%;
    --media-range-thumb-box-shadow: none;
  }

  media-loading-indicator {
    color: #fff;
    --media-loading-indicator-icon-width: 32px;
    --media-loading-indicator-icon-height: 32px;
  }

  media-controller:not([medialoading]) media-loading-indicator { display: none; }

  @media (max-width: 360px) {
    .center-controls { gap: 22px; }
    .bottom-bar media-time-display:first-of-type { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 1ms !important; }
  }
</style>
